id: js-bundle-secrets
name: JavaScript Secret Exposure
severity: high
tags: [info-disclosure, wstg-info-05, cwe-200]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"

oracles:
  - type: pattern_match
    regex: 'AKIA[0-9A-Z]{16}'
    verdict: VULNERABLE
  - type: pattern_match
    regex: 'sk_live_[A-Za-z0-9]{24,}'
    verdict: VULNERABLE
  - type: pattern_match
    regex: 'eyJ[A-Za-z0-9_\-]+\\.eyJ[A-Za-z0-9_\-]+\\.[A-Za-z0-9_\-]+'
    verdict: SUSPICIOUS
