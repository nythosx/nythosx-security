id: user-enumeration-timing
name: User Enumeration via Timing
severity: medium
tags: [enumeration, wstg-athn-04, cwe-204]

inputs:
  target_url:
    type: string
    required: true
  samples:
    type: int
    default: 5

steps:
  - name: warmup
    repeat: 3
    request:
      method: POST
      url: "{{ inputs.target_url }}"
      json:
        email: "warmup_connection_probe@example.com"
        username: "warmup_connection_probe@example.com"
        identifier: "warmup_connection_probe@example.com"
        password: "wrong"
  - name: invalid_user
    repeat: "{{ inputs.samples }}"
    request:
      method: POST
      url: "{{ inputs.target_url }}"
      json:
        email: "doesnotexist_xyz@example.com"
        username: "doesnotexist_xyz@example.com"
        identifier: "doesnotexist_xyz@example.com"
        password: "wrong"
  - name: valid_user
    repeat: "{{ inputs.samples }}"
    request:
      method: POST
      url: "{{ inputs.target_url }}"
      json:
        email: "admin@example.com"
        username: "admin@example.com"
        identifier: "admin@example.com"
        password: "wrong"

oracles:
  - type: timing_difference
    threshold_ms: 100
    verdict: SUSPICIOUS
