id: graphql-schema-walk
name: GraphQL Schema Reconstruction (Suggestion Walking)
severity: medium
tags: [graphql, recon, info-disclosure, wstg-apit-99, cwe-200]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: POST
      url: "{{ inputs.target_url }}"
      follow_redirects: false

oracles:
  - type: graphql_schema_walk
    verdict: SUSPICIOUS
