id: sourcemap-mining
name: JavaScript Source Map Exposure
severity: medium
tags: [sourcemap, recon, info-disclosure, wstg-info-05, cwe-540]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"
      follow_redirects: false

oracles:
  - type: sourcemap_mine
    verdict: SUSPICIOUS
