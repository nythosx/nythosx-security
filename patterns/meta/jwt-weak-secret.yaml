id: jwt-weak-secret
name: JWT Weak HMAC Secret
severity: critical
tags: [jwt, wstg-athn-04, cwe-347]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"

oracles:
  - type: jwt_weak_secret
    verdict: VULNERABLE
