id: jwt-analysis
name: JWT Analysis (structure, expiration)
severity: medium
tags: [jwt, auth, wstg-sess-10, cwe-613]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"

oracles:
  - type: pattern_match
    regex: 'eyJ[A-Za-z0-9_\-]+\.eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+'
    verdict: SUSPICIOUS
