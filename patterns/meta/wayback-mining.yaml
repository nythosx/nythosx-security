id: wayback-mining
name: Historic URL Harvest (Wayback + CommonCrawl)
severity: medium
tags: [recon, wstg-info-01, cwe-200]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"
      follow_redirects: false

oracles:
  - type: wayback_harvest
    verdict: SUSPICIOUS
