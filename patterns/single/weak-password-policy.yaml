id: weak-password-policy
name: Weak Password Policy
severity: high
destructive: true
opt_in: true
destructive_reason: "Attempts to change the authenticated user's password."
tags: [password-policy, auth, wstg-athn-07, cwe-521]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"

oracles:
  - type: weak_password_scan
    verdict: VULNERABLE
