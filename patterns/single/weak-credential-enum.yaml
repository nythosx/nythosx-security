id: weak-credential-enum
name: Weak Credential Enumeration
severity: critical
tags: [credentials, auth, wstg-athn-05, cwe-521]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"

oracles:
  - type: weak_credential_scan
    verdict: VULNERABLE
