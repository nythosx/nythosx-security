id: upload-probe
name: File Upload Restriction Bypass
severity: critical
destructive: true
opt_in: true
destructive_reason: "Writes files to the target via upload endpoints."
tags: [upload, rce, wstg-busl-09, cwe-434]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"

oracles:
  - type: upload_scan
    verdict: VULNERABLE
