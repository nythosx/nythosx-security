id: server-disclosure
name: Server Version Disclosure
severity: low
tags: [info-disclosure, wstg-info-02, cwe-200]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"

oracles:
  - type: header_value_match
    header: Server
    regex: "\\d+\\.\\d+"
    verdict: SUSPICIOUS
  - type: header_value_match
    header: X-Powered-By
    regex: ".+"
    verdict: SUSPICIOUS
