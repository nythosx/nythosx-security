id: security-headers-missing
name: Missing Security Headers
severity: medium
tags: [headers, wstg-conf-07, cwe-693]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"
      follow_redirects: true

oracles:
  - type: header_absent
    critical:
      - Strict-Transport-Security
      - X-Content-Type-Options
      - X-Frame-Options
    recommended:
      - Content-Security-Policy
      - Referrer-Policy
      - Permissions-Policy
    verdict: VULNERABLE
    recommended_verdict: SUSPICIOUS
