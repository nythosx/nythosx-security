id: mcp-credential-exposure
name: MCP Configuration Credential Exposure
severity: critical
tags: [mcp, secrets-exposure, cwe-798, cwe-200]
inputs:
  config_path:
    type: string
    required: true
steps:
  - name: read_config
    request:
      method: GET
      url: "file://{{ inputs.config_path }}"
oracles:
  - type: mcp_credential_exposure
    verdict: VULNERABLE
