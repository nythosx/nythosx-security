id: cache-deception
name: Web Cache Deception
severity: high
tags: [cache, access-control, wstg-conf-05, cwe-525]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: GET
      url: "{{ inputs.target_url }}"
      follow_redirects: false

oracles:
  - type: cache_deception_scan
    verdict: VULNERABLE
