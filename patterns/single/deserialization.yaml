id: deserialization
name: Unsafe Deserialization
severity: critical
tags: [deserialization, injection, wstg-inpv-11, cwe-502]

inputs:
  target_url:
    type: string
    required: true

steps:
  - name: probe
    request:
      method: POST
      url: "{{ inputs.target_url }}"
      follow_redirects: false

oracles:
  - type: deserialization_scan
    verdict: VULNERABLE
