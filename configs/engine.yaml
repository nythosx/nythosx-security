http:
  timeout_seconds: 30
  follow_redirects: false
  verify_tls: true
  max_retries: 3
  backoff_base_ms: 500
  user_agent_rotation: true
  default_user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) sec-checker/1.0
rate_limit:
  global_rps: 10
  per_endpoint_rps: 5
  burst: 20
  on_429_backoff_ms: 5000
discovery:
  prefer_https: true
  schemes:
  - https
  - http
  base_paths:
  - ''
  - /api
  - /api/v1
  - /api/v2
  - /api/latest
  - /v1
  - /v2
  - /rest
  - /graphql
  confirm_subpaths:
  - ''
  - /health
  - /healthz
  - /status
  - /ping
  - /version
  reject_redirect_only: true
  follow_redirects: true
  probe_timeout_seconds: 6
concurrency:
  max_workers: 50
evidence:
  save_raw_bodies: true
  max_body_size_kb: 100
report:
  severity_threshold: info
roe:
  enabled: true
  enforce_scope: true
  enforce_methods: true
ssrf_cloud:
  allow_direct_metadata_probe: false
brain:
  enabled: true
  provider: llm
  model: ''
  llm:
    provider: gemini
    model: gemini-flash-lite-latest
    base_url: ''
    api_key_env: ''
  tools: {}
correlator:
  enabled: true
  confidence_threshold: 0.7
coverage:
  enabled: true
  include_untested: true
orchestrator:
  budget:
    max_iterations: 5
    max_http_requests: 500
    max_duration_seconds: 300
    max_hypotheses_per_iter: 20
    convergence_window: 2
weak_password:
  enabled: true
  opt_in_destructive: false
injection:
  enabled: true
  oob_callback_url: ''
websocket:
  enabled: true
  timeout_seconds: 10
oauth:
  enabled: true
  test_origins:
  - https://attacker.example.com
upload:
  enabled: true
  opt_in: false
http2:
  enabled: true
  rapid_reset_max: 20

cve_lookup:
  enabled: true
  nvd_api_key_env: NVD_API_KEY
  timeout_seconds: 15
  cache_ttl_seconds: 86400
  max_results_per_product: 25
  cpe_overrides: {}
access_bypass:
  enabled: true
  header_overrides:
  - X-Original-URL
  - X-Rewrite-URL
  - X-Override-URL
  - X-Forwarded-Prefix
  - X-HTTP-Method-Override
  - X-Method-Override
  - X-Forwarded-For
  - X-Forwarded-Host
  - X-Real-IP
  - X-Originating-IP
  - X-Remote-IP
  - X-Client-IP
  - X-Trusted-By
  path_mutations:
  - '{p}/'
  - '{p}/.'
  - '{p}/%2e'
  - '{p}%20'
  - '{p}%09'
  - '{p}?x=1'
  - '{p}..;/'
  - '{p}#'
  - '{p}%23'
  - '{p}/*'
  - '{p}.json'
  - '{p}.html'
  timeout_seconds: 8
cache_deception:
  enabled: true
  extensions:
  - .css
  - .js
  - .png
  - .jpg
  - .jpeg
  - .svg
  - .ico
  - .woff
  - .woff2
  - .txt
  - .json
  - .html
  cache_header_keys:
  - x-cache
  - cf-cache-status
  - x-cache-status
  - x-served-by
  - x-vercel-cache
  - x-proxy-cache
  - akamai-cache-status
  - age
  cache_hit_markers:
  - hit
  - HIT
  - cached
  timeout_seconds: 8

banking:
  mask_chars: 1
  cipher: rot13
  endpoints_authenticated:
  - /api/v1/me
  - /api/v1/profile
  - /api/v1/user
  - /api/v1/accounts
  - /api/v1/accounts/1
  - /api/v1/accounts/2
  - /api/v1/transactions
  - /api/v1/transactions/1
  - /api/v1/customers
  - /api/v1/customers/1
  - /api/v1/balance
  - /api/v1/cards
  - /api/v1/statements
  - /api/v1/beneficiaries
  - /api/v1/payments
  endpoints_unauthenticated:
  - /api/v1/accounts
  - /api/v1/accounts/1
  - /api/v1/transactions
  - /api/v1/customers
  - /api/v1/balance
  - /check_balance/1
  - /api/v1/statements
  - /api/v1/cards

outcome:
  track: true

approval:
  mode: off

harvest:
  enabled: false

exploit:
  enabled: false
