# Credentials example. Copy to configs/credentials.yaml and edit.
# configs/credentials.yaml is gitignored — do not commit real credentials.
credentials:
  localhost:
    username: user@example.com
    password: change-me
    login_url: http://localhost:8000/api/login
    login_type: json
    username_field: email
    password_field: password
    token_path: token
