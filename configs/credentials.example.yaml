# Credentials example. Copy to configs/credentials.yaml and edit.
# configs/credentials.yaml is gitignored — do not commit real credentials.
#
# Vault (optional): set SEC_CHECKER_VAULT_KEY in env, then run
#   python -c "from engine import secrets_vault; secrets_vault.encrypt_file()"
# to encrypt this file at rest. The scanner will transparently decrypt it.
credentials:
  localhost:
    username: user@example.com
    password: change-me
    login_url: http://localhost:8000/api/login
    login_type: json
    username_field: email
    password_field: password
    token_path: token
