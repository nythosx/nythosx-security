[project]
name = "sec-checker"
version = "1.4.0"
description = "Local-first black-box security scanner with adaptive attack chains"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "sec-checker contributors" }]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["evidence", "findings", "reports", "workflows", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "evidence|findings|reports|workflows"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --no-header"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = "evidence|findings|reports|workflows"
