families:
  secrets-exposure:
    title: Secrets Exposure
    attack: An unauthenticated attacker fetches {artifact} directly and harvests the credentials inside.
    impact: Full compromise of the application and every downstream system that trusts the leaked credentials
      ({leaked}).
    fix: Remove {artifact} from the web root, rotate every credential it contained, and add it to your
      deploy-exclude list.
    refs:
      owasp: A02
      cwe:
      - CWE-538
      - CWE-200
      wstg: WSTG-CONF-02
  debug-mode:
    title: Debug Mode Exposure
    attack: An attacker triggers an error and reads the framework's debug page, which lists source paths,
      env vars, and stack frames.
    impact: Sensitive configuration and internal source are disclosed, accelerating every subsequent attack.
    fix: Set debug=false in production, disable the debug toolbar, and never expose stack traces to unauthenticated
      clients.
    refs:
      owasp: A02
      cwe:
      - CWE-209
      - CWE-215
      wstg: WSTG-CONF-02
  security-misconfiguration:
    title: Security Misconfiguration
    attack: An attacker observes the missing hardening headers or over-permissive HTTP methods and pivots
      accordingly.
    impact: Missing browser-side defenses magnify the blast radius of any XSS, clickjacking, or downgrade
      attack.
    fix: Serve {header} on every response, or restrict dangerous methods at the edge.
    refs:
      owasp: A02
      cwe:
      - CWE-693
      - CWE-16
      wstg: WSTG-CONF-07
  info-disclosure:
    title: Information Disclosure
    attack: An attacker reads {source} from a normal response and maps the backend stack, versions, and
      internal paths.
    impact: Reconnaissance shortcut. Attackers no longer need to guess versions or framework quirks.
    fix: Strip or normalize the leaking response, and log the event for detection.
    refs:
      owasp: A02
      cwe:
      - CWE-200
      wstg: WSTG-INFO-02
  cors-misconfiguration:
    title: CORS Misconfiguration
    attack: An attacker's origin is reflected in Access-Control-Allow-Origin, so any website can read
      the response with the victim's cookies.
    impact: 'Cross-origin data theft: user profile, CSRF tokens, private API data.'
    fix: Use an explicit allowlist for CORS origins and never combine wildcard with credentials.
    refs:
      owasp: A01
      cwe:
      - CWE-942
      - CWE-346
      wstg: WSTG-CONF-05
  auth-weaknesses:
    title: Authentication Weakness
    attack: An attacker enumerates users, brute-forces credentials, or reuses a stolen session because
      the control is missing.
    impact: Account takeover with no exploitation of code — only policy gaps.
    fix: Add rate limiting, generic error messages, and rotate {artifact} on privilege change.
    refs:
      owasp: A07
      cwe:
      - CWE-307
      - CWE-204
      - CWE-614
      wstg: WSTG-ATHN-03
  access-control:
    title: Broken Access Control
    attack: An attacker changes an identifier, method, or body field and accesses resources they should
      not own.
    impact: Horizontal or vertical privilege escalation — the most common critical web-app finding.
    fix: Enforce ownership and role checks server-side on every request, not just in the UI.
    refs:
      owasp: A01
      cwe:
      - CWE-639
      - CWE-284
      - CWE-918
      wstg: WSTG-ATHZ-04
  injection:
    title: Injection
    attack: Attacker-controlled input reaches an interpreter (HTML, GraphQL, script engine, template)
      unchanged.
    impact: Script execution in the victim's browser, backend code execution, or server-side resource
      exhaustion.
    fix: Context-aware encode all output, enforce schema, and cap query complexity.
    refs:
      owasp: A05
      cwe:
      - CWE-79
      - CWE-770
      wstg: WSTG-INPV
  cryptographic-failures:
    title: Cryptographic Failure
    attack: An attacker forges, replays, or downgrades a token because the signature scheme or secret
      is weak.
    impact: Full authentication bypass without knowing any password.
    fix: Use strong algorithms with adequate key entropy and validate signatures with a strict allowlist.
    refs:
      owasp: A04
      cwe:
      - CWE-347
      - CWE-916
      wstg: WSTG-SESS-10
  business-logic:
    title: Business Logic Flaw
    attack: An attacker reorders, skips, or replays a step in a multi-stage flow the server does not enforce.
    impact: Financial loss, unauthorized state transitions, or free product.
    fix: Enforce step ordering and idempotency server-side, and re-validate every parameter on the final
      step.
    refs:
      owasp: A06
      cwe:
      - CWE-840
      - CWE-841
      wstg: WSTG-BUSL-01
  race-conditions:
    title: Race Condition
    attack: An attacker fires {count} identical requests in one burst; the server handles more than one
      because the guard is not atomic.
    impact: 'Limit overrun: multiple coupon redemptions, multiple withdrawals, multiple votes.'
    fix: Use database-level locks, idempotency keys, or serialized transaction boundaries.
    refs:
      owasp: A06
      cwe:
      - CWE-362
      - CWE-367
      wstg: WSTG-BUSL-04
  supply-chain:
    title: Supply Chain
    attack: An attacker leverages a known-vulnerable dependency or build-time artifact the target ships.
    impact: Pre-auth RCE, data exfil, or full compromise — depending on the CVE.
    fix: Upgrade to a fixed version, pin transitive deps, and monitor advisories continuously.
    refs:
      owasp: A03
      cwe:
      - CWE-1104
      - CWE-1035
      wstg: WSTG-CONF-03
  llm-security:
    title: LLM Security
    attack: An attacker injects text into the model's context or extracts its instructions and tool surface.
    impact: Data exfil through the model, unauthorized tool invocation, or reputational damage via prompt
      output.
    fix: Apply input/output filters, least-privilege tool scopes, and never trust model output as code
      or markup.
    refs:
      owasp_llm: LLM01
      cwe:
      - CWE-77
      - CWE-1426
  api-schema:
    title: API Schema Exposure
    attack: An attacker reads the OpenAPI or Swagger document and enumerates every endpoint, parameter,
      and auth flow.
    impact: Complete API map for downstream fuzzing, forced browsing, and parameter tampering.
    fix: Gate the schema behind authentication in production, or disable it entirely.
    refs:
      owasp: A02
      cwe:
      - CWE-200
      - CWE-538
      wstg: WSTG-CONF-01
  denial-of-service:
    title: Denial of Service
    attack: An attacker sends crafted requests that consume disproportionate server resources (deep queries,
      oversized payloads, unbounded loops) and degrades availability for legitimate users.
    impact: Availability loss. Downstream services may cascade-fail; SLA and reputation impact are immediate.
    fix: Enforce query complexity limits, request size caps, per-IP rate limits, and timeouts on every
      backend call.
    refs:
      owasp: A06
      cwe:
      - CWE-400
      - CWE-770
      wstg: WSTG-BUSL-05
  oauth:
    title: OAuth / OIDC Flow Weakness
    attack: An attacker manipulates the authorization request (redirect_uri, state, PKCE, id_token) to
      hijack the flow or obtain tokens.
    impact: Account takeover via stolen authorization codes or tokens.
    fix: Validate redirect_uri against an exact-match allowlist, require state, enforce S256 PKCE, and
      verify id_token signatures strictly.
    refs:
      owasp: A07
      cwe:
      - CWE-352
      - CWE-601
      wstg: WSTG-ATHN-05
  blind-injection:
    title: Blind / Time-Based Injection
    attack: An attacker infers that injected code executed by measuring the response time, without seeing
      output.
    impact: Remote code execution or data extraction through a channel that produces no visible response.
    fix: Use parameterised queries and sandboxed template contexts. Reject unvalidated input before it
      reaches any interpreter.
    refs:
      owasp: A05
      cwe:
      - CWE-89
      - CWE-1336
      - CWE-611
      wstg: WSTG-INPV
  known-vulnerability:
    title: Known CVE on Detected Component
    attack: An attacker reads the version banner, looks up the exact component in a public CVE database,
      and exploits the specific vulnerability for that release.
    impact: Depends on the CVE. Ranges from information disclosure to pre-auth remote code execution.
    fix: Upgrade the component to a patched release and hide the version banner in the response.
    refs:
      owasp: A03
      cwe:
      - CWE-1035
      - CWE-1104
      wstg: WSTG-CONF-03
  cache-deception:
    title: Web Cache Deception
    attack: An attacker appends a cacheable extension to an authenticated URL. A CDN keyed on the extension
      caches the private response, and any unauthenticated request to the same URL receives the victim
      data.
    impact: Bulk disclosure of PII, session tokens, or private account data to any unauthenticated visitor
      who requests the poisoned URL.
    fix: Configure the CDN to respect Cache-Control private/no-store from the origin and never key on
      file extension alone.
    refs:
      owasp: A01
      cwe:
      - CWE-525
      - CWE-524
      wstg: WSTG-CONF-05
patterns:
  env-file-exposure:
    family: secrets-exposure
    gap: The web server serves .env as a static file instead of blocking the dot-file.
    vars:
      artifact: .env
      leaked:
        path: evidence.matched_keys
        default: APP_KEY, DB_PASSWORD, and other secrets
        join: ', '
  js-bundle-secrets:
    family: secrets-exposure
    gap: API keys and tokens are inlined into a JavaScript bundle that any visitor can fetch.
    vars:
      artifact: a public JavaScript bundle
      leaked:
        path: evidence.matched_keys
        default: API keys, JWTs, or cloud credentials
  laravel-debug-mode:
    family: debug-mode
    gap: Laravel's Ignition error page is reachable in production.
  security-headers-missing:
    family: security-misconfiguration
    gap: The response omits {header}.
    vars:
      header:
        path: evidence.missing_headers
        default: one or more security headers
        join: ', '
  authed-security-headers:
    family: security-misconfiguration
    gap: An authenticated API response drops the browser hardening headers.
    vars:
      header: X-Content-Type-Options and X-Frame-Options
  http-methods-allowed:
    family: security-misconfiguration
    gap: The server allows {method}, which is not needed for normal operation.
    vars:
      method:
        path: evidence.method
        default: TRACE
  server-disclosure:
    family: info-disclosure
    gap: The {header} header reveals the exact backend version.
    vars:
      header:
        path: evidence.header
        default: Server or X-Powered-By
      source: the Server and X-Powered-By headers
  api-exposed-headers:
    family: info-disclosure
    gap: The API response includes version banners or debug headers.
    vars:
      source: response headers
  api-info-disclosure:
    family: info-disclosure
    gap: An error response includes source paths, class names, or config values.
    vars:
      source: the error body
  api-error-handling:
    family: info-disclosure
    gap: The API returns 5xx on a request that should be a clean 4xx.
    vars:
      source: internal stack traces
  graphql-introspection:
    family: info-disclosure
    gap: GraphQL introspection is enabled in production.
    vars:
      source: the __schema response
  cors-wildcard:
    family: cors-misconfiguration
    gap: The API reflects arbitrary Origin headers or uses a wildcard.
  api-cors-preflight:
    family: cors-misconfiguration
    gap: The preflight response accepts attacker-controlled origins and methods.
  cookie-flags-missing:
    family: auth-weaknesses
    gap: The session cookie is missing {flag}.
    vars:
      flag:
        path: evidence.missing_flags
        default: Secure, HttpOnly, or SameSite
        join: ', '
      artifact: the session cookie
  rate-limit-absent:
    family: auth-weaknesses
    gap: The login endpoint never returns 429, no matter how many requests are sent.
    vars:
      artifact: the rate limiter
  user-enumeration-timing:
    family: auth-weaknesses
    gap: Response timing differs for existing vs. non-existing users.
  auth-bypass-probe:
    family: access-control
    gap: The endpoint returns 200 to unauthenticated requests.
  authed-idor:
    family: access-control
    gap: Changing the numeric ID in the URL returns another user's record.
  idor-sequential:
    family: access-control
    gap: Sequential IDs are enumerable and return distinct 200 responses.
  mass-assignment:
    family: access-control
    gap: The server accepts privileged fields (is_admin, role) from the request body.
  ssrf-cloud-metadata:
    family: access-control
    gap: The target fetches attacker-controlled URLs, reaching cloud metadata.
  dom-xss-advanced:
    family: injection
    gap: User-controlled input flows into a dangerous JavaScript sink without sanitization.
  graphql-deep-security:
    family: injection
    gap: The GraphQL endpoint has no depth limit, batch cap, or CSRF control.
  cache-poisoning-probe:
    family: injection
    gap: An unkeyed header is reflected in the cached response.
  jwt-analysis:
    family: cryptographic-failures
    gap: The token is a JWT with a weak or unexpected shape.
  jwt-weak-secret:
    family: cryptographic-failures
    gap: The HMAC secret is a common word or default value.
  jwt-advanced-analysis:
    family: cryptographic-failures
    gap: The token uses alg:none, unsafe kid, or an embedded JWK.
  timing-vs-baseline:
    family: cryptographic-failures
    gap: The response timing differs from the recorded baseline by more than 3 sigma.
  bizlogic-scan:
    family: business-logic
    gap: A multi-step flow accepts reordered or skipped steps.
  idempotency-violation:
    family: business-logic
    gap: The same POST body returns different state across two calls.
  race-condition-basic:
    family: race-conditions
    gap: Concurrent requests produce inconsistent state.
    vars:
      count:
        path: inputs.concurrency
        default: '20'
  race-condition-authed:
    family: race-conditions
    gap: Concurrent authenticated requests violate a business invariant.
    vars:
      count:
        path: inputs.concurrency
        default: '30'
  race-advanced:
    family: race-conditions
    gap: A concurrent burst produces more than one success.
    vars:
      count:
        path: inputs.concurrency
        default: '20'
  openapi-fuzz:
    family: api-schema
    gap: The OpenAPI or Swagger document is publicly readable and drives the fuzz.
  llm-prompt-injection:
    family: llm-security
    gap: The model follows instructions embedded in user input and ignores its system prompt.
  llm-output-handling:
    family: llm-security
    gap: Model output is inserted into HTML without escaping.
  llm-sensitive-disclosure:
    family: llm-security
    gap: The model reveals credentials, tokens, or config values on request.
  llm-system-prompt-leak:
    family: llm-security
    gap: The model echoes its system prompt or tool list.
  llm-excessive-agency:
    family: llm-security
    gap: The model executes dangerous tool calls without approval.
  ssti-probe:
    family: injection
    gap: User-controlled input reaches a template engine that evaluates it as code.
  xxe-probe:
    family: injection
    gap: The XML parser resolves external entities declared in user input.
  nosql-probe:
    family: injection
    gap: JSON operator objects ($ne, $gt, $regex) are passed to the query layer unvalidated.
  crlf-injection:
    family: injection
    gap: CR/LF characters in user input reach an HTTP response header.
  open-redirect:
    family: access-control
    gap: The redirect target is taken from a user-controlled param without an allowlist.
  host-header-injection:
    family: injection
    gap: The Host header (or X-Forwarded-Host) is reflected in a URL, redirect, or password-reset link.
  websocket-cswsh:
    family: access-control
    gap: The WebSocket handshake accepts any Origin and does not require authentication.
  oauth-redirect-uri:
    family: access-control
    gap: The authorization endpoint accepts redirect_uri values outside the client's registered list.
  oauth-missing-state:
    family: auth-weaknesses
    gap: The authorization endpoint accepts requests without a state parameter.
  upload-probe:
    family: injection
    gap: The upload endpoint accepts dangerous file extensions or content types.
  http2-desync:
    family: injection
    gap: The HTTP/2 front-end and back-end disagree on how to interpret CL/TE headers.
  weak-password-policy:
    family: auth-weaknesses
    gap: The account password policy accepts short, common, or dictionary passwords.
  lockout-probe:
    family: auth-weaknesses
    gap: The login endpoint never locks or rate-limits the account after repeated failures.
  weak-credential-enum:
    family: auth-weaknesses
    gap: A small curated list of common credentials is sufficient to authenticate as an admin.
  oauth-pkce-downgrade:
    family: oauth
    gap: The authorization endpoint accepts PKCE plain or omits PKCE entirely.
  timing-sqli:
    family: blind-injection
    gap: An injected SLEEP / pg_sleep / WAITFOR DELAY payload extends the response time.
  timing-ssti:
    family: blind-injection
    gap: An injected CPU-heavy template loop extends the response time.
  timing-xxe:
    family: blind-injection
    gap: An external entity pointing at a non-routable host extends the response time.
  second-order-xss:
    family: injection
    gap: A marker submitted to one endpoint appears unescaped on another endpoint that renders user content.
  cve-correlation:
    family: known-vulnerability
    gap: The detected component version is affected by {count} known CVE(s).
    vars:
      count:
        path: evidence.total
        default: one or more
  access-bypass:
    family: access-control
    gap: An HTTP {status} access-control gate was bypassed via header overrides or path mutations.
    vars:
      status:
        path: evidence.baseline_status
        default: '403'
  cache-deception:
    family: cache-deception
    gap: A sensitive 200 response was cached by a shared CDN when accessed via a cacheable file extension.
  differential-auth:
    family: access-control
    gap: Cross-auth probing found a structural response difference — either anonymous reaches what should
      be authenticated, or user A sees user B's data at the same URL.
  wayback-mining:
    family: info-disclosure
    gap: Historic URLs include {count} paths and {param_count} parameters that the current site no longer
      links. Some may still be routed.
    vars:
      count:
        path: total_urls_seen
        default: several
      param_count:
        path: params
        default: some
  framework-surface:
    family: known-vulnerability
    gap: A known-vulnerable framework surface was reachable — debug endpoints, management paths, or installer
      scripts that were never meant to be public in production.
  timing-robust:
    family: blind-injection
    gap: A statistically significant timing difference between baseline and sleep payload requests — non-parametric
      test rejects the null at p<0.05.
  deserialization:
    family: injection
    gap: An endpoint passed attacker-supplied bytes to a native deserializer (Java ObjectInputStream,
      PHP unserialize, Python pickle, .NET BinaryFormatter) and surfaced a parser error.
  graphql-schema-walk:
    family: info-disclosure
    gap: Introspection is disabled, but field-suggestion hints leak field names. Walking the hints reconstructed
      {count} root field(s).
    vars:
      count:
        path: discovered_fields
        default: several
  sourcemap-mining:
    family: info-disclosure
    gap: A JavaScript source map is shipped in production and contains original source — including parameter
      names and internal URLs.
  ct-subdomain:
    family: info-disclosure
    gap: CT logs list {count} subdomain(s) for this domain. Historic hostnames frequently sit on stale
      infrastructure with older code.
    vars:
      count:
        path: count
        default: several
  subdomain-takeover:
    family: info-disclosure
    gap: A subdomain response matches a third-party service's "resource not found" fingerprint — the CNAME
      still points at the service but no resource claims the name, so anyone can register it.
  cloud-storage:
    family: info-disclosure
    gap: Derived bucket names resolve on a cloud provider — at least one is publicly listable or available
      for registration.
  hpp-scan:
    family: injection
    gap: Duplicate parameters on a reflected input showed last-wins parsing, which can bypass WAF matching
      or authorization filters that only inspect the first occurrence.
  banking-recon:
    family: info-disclosure
    gap: Banking-specific API paths (accounts, transactions, customers, balance, statements, cards, loans,
      payments, transfers) were probed directly and {count} responded with JSON, revealing the shape of
      the protected surface.
    vars:
      count:
        path: hits
        default: several
  unauth-exposure:
    family: access-control
    gap: Endpoints that require authentication in the UI returned JSON data without any credentials. Banking
      APIs frequently ship with endpoints that were authenticated during development and lost the check
      at deployment.
  data-extraction:
    family: info-disclosure
    gap: A single authenticated request to {endpoint} returned {rows} structured row(s) in a JSON response.
      Fields matching known banking identifiers (account, balance, transaction, card, customer) were present
      in the body.
    vars:
      endpoint:
        path: url
        default: the target endpoint
      rows:
        path: total_rows
        default: multiple
  bola-scan:
    family: access-control
    gap: Two distinct authenticated sessions reach the same endpoint and receive different rows. The server
      checked authentication but not authorization — user B was able to read user A's data by presenting
      their own valid token.
  rate-limit-bypass:
    family: auth-weaknesses
    gap: Rotating forwarded-IP headers (X-Forwarded-For, X-Real-IP, X-Originating-IP) between requests
      caused the rate limiter to treat each request as coming from a different client, so no HTTP 429
      was ever returned. Banking APIs commonly trust these headers for client identification.
  bola-harvest:
    family: access-control
    title: BOLA / BFLA Data Harvesting
    attack: Using user-B's valid token, the attacker walks the sequential ID space of {endpoint} and reads
      user-A's records. No exploit is needed — the server checks authentication but not authorization.
    gap: The endpoint reads the object by ID without verifying that the ID belongs to the authenticated
      subject.
    impact: 'Bulk disclosure of customer records: {record_count} record(s) extracted, including {sample_fields}.'
    fix: Enforce ownership server-side on every object lookup. Scope the query by the authenticated subject
      or check an ACL before returning the record.
    vars:
      endpoint:
        path: evidence.endpoint
        default: the affected endpoint
      record_count:
        path: evidence.total_rows
        default: multiple
      sample_fields:
        path: evidence.sample_fields
        default: PII
  unauth-pagination-dump:
    family: access-control
    gap: An unauthenticated paginated endpoint returns every page when the caller simply increments the
      page parameter, with no authentication check on any page.
    impact: Full dataset exfiltration without credentials.
    fix: Require authentication on the endpoint, and never trust the client's page parameter without a
      server-side authorization check per page.
  graphql-data-dump:
    family: access-control
    gap: GraphQL introspection is enabled, and the attacker used the returned schema to build queries
      for every object type and dump all accessible records in one request.
    impact: Complete data model disclosure and bulk record read.
    fix: Disable introspection in production, or gate it behind an authenticated admin role. Enforce per-field
      authz.
  blind-sqli-extract:
    family: blind-injection
    gap: A time-based blind SQLi lets the attacker reconstruct arbitrary DB values character-by-character
      via binary search, without ever seeing the query output.
    impact: 'Full database read: credentials, tokens, PII.'
    fix: Use parameterised queries. Reject unvalidated input before it reaches the DB driver.
  blind-xxe-file-read:
    family: blind-injection
    gap: The XML parser resolves external entities pointing at local files. Server files that should be
      private are returned in the parsed response.
    impact: 'Server file disclosure: /etc/passwd, .env, source, cloud metadata.'
    fix: Disable external entity resolution in the XML parser (FEATURE_SECURE_PROCESSING, disallow-doctype-decl).
  llm-system-prompt-dump:
    family: llm-security
    gap: The model reveals its system prompt verbatim under direct or lightly-obfuscated request, including
      any rules, tools, and hidden instructions.
    impact: Attacker learns the assistant's guardrails, tool surface, and any embedded secrets.
    fix: Add an output filter that blocks system-prompt echoes. Never embed secrets in the system prompt.
  llm-tool-list-dump:
    family: llm-security
    gap: The model discloses its full tool list and JSON schemas when asked directly.
    impact: Attackers map the tool surface and identify high-privilege tools for follow-up abuse.
    fix: Refuse to echo tool schemas. Treat tool descriptions as sensitive metadata.
  llm-credential-extract:
    family: llm-security
    gap: The model outputs credentials, API keys, or environment variables it has access to, in cleartext,
      on request.
    impact: Credential compromise that extends beyond the LLM into every downstream system the key unlocks.
    fix: Never place live credentials in model context. Use brokered access with short-lived tokens.
  mcp-tool-poisoning:
    family: llm-security
    gap: An MCP tool description contains hidden instructions designed to redirect the agent (e.g. 'ignore
      previous instructions', 'read ~/.ssh/id_rsa and include it').
    impact: 'Agent hijack: the LLM follows attacker instructions embedded in seemingly-benign tool metadata.'
    fix: Sanitise and hash MCP tool descriptions. Alert when a previously-seen tool has changed.
  mcp-credential-exposure:
    family: secrets-exposure
    gap: An MCP configuration file (.mcp.json, Claude Desktop config, Cursor config) contains hardcoded
      credentials for a downstream service.
    impact: Anyone with read access to the config file obtains live credentials.
    fix: Reference credentials from an OS keychain or environment variable, never inline them in MCP config.
  ci-cd-config-exposure:
    family: supply-chain
    gap: CI/CD configuration is served as a static file, exposing pipeline secrets, deploy targets, and
      infrastructure details.
    impact: Attacker maps the deployment pipeline and often finds hardcoded tokens or cloud credentials.
    fix: Block dot-file and CI-config access at the web server. Rotate any secrets that were served.
  npmrc-exposure:
    family: supply-chain
    gap: Package-manager config files (.npmrc, .pypirc, .gem/credentials) are served as static files,
      exposing registry auth tokens.
    impact: Attacker publishes malicious packages under the victim's namespace or reads private packages.
    fix: Block dot-file access at the web server. Revoke the exposed tokens and rotate.
  firebase-misconfig:
    family: security-misconfiguration
    gap: A Firebase Realtime Database or Firestore endpoint accepts unauthenticated reads (`.json` returns
      data).
    impact: Full read (and often write) access to the app's database without any credentials.
    fix: Set Firebase security rules to require authentication and enforce per-user data scoping.
  session-fixation:
    family: auth-weaknesses
    gap: The session identifier issued before login is not rotated after successful authentication.
    impact: An attacker who fixed the session ID before login shares the victim's authenticated session.
    fix: Rotate the session ID on every privilege change, including login, logout, and password change.
  postmessage-abuse:
    family: injection
    gap: A `message` event handler does not validate the origin of the sender and acts on `event.data`
      directly.
    impact: Any page that frames the target can post messages and control its behaviour.
    fix: Always check `event.origin` against an allowlist before processing the message.
