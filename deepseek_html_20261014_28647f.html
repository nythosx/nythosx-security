<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sec-checker · llm-enhanced flow</title>
<style>
/* ═══════════════════════════════════════════════════════════
   THEME VARIABLES (dark default, light toggle)
   ═══════════════════════════════════════════════════════════ */
:root, body.theme-dark {
  --bg: #0a0c10;
  --panel: #10141b;
  --panel2: #161b24;
  --border: #232a37;
  --border-hi: #38414f;
  --fg: #e6edf3;
  --muted: #7d8998;
  --dimmer: #4a5361;
  --accent: #58a6ff;
  --accent2: #79c0ff;
  --prompt: #79c0ff;
  --response: #3fb950;
  --ok: #3fb950;
  --crit: #f85149;
  --high: #ff7b72;
  --med: #d29922;
  --low: #58a6ff;
  --grid: rgba(35,42,55,0.35);
  --shadow: rgba(0,0,0,0.5);
}
body.theme-light {
  --bg: #efefec;
  --panel: #ffffff;
  --panel2: #f6f6f3;
  --border: #e6e6e1;
  --border-hi: #d9d9d4;
  --fg: #141414;
  --muted: #8b8b86;
  --dimmer: #b5b5af;
  --accent: #d98a00;
  --accent2: #e09a30;
  --prompt: #4a7fd9;
  --response: #2f9e5f;
  --ok: #2f9e5f;
  --crit: #d94444;
  --high: #e5484d;
  --med: #d98a00;
  --low: #4a7fd9;
  --grid: rgba(214,214,209,0.5);
  --shadow: rgba(17,17,17,0.13);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  transition: background 400ms, color 400ms;
}

/* ═══════════════════════════════════════════════════════════
   LAYOUT — chart gets all the leftover space.
   Bottom dock is `auto` (collapsible), sidebar is toggleable.
   ═══════════════════════════════════════════════════════════ */
body {
  display: grid;
  grid-template-rows: 52px 1fr auto;
  grid-template-columns: 1fr 420px;
  grid-template-areas:
    "header header"
    "chart  side"
    "dock   dock";
  transition: background 400ms, color 400ms,
              grid-template-columns 340ms cubic-bezier(.2,.8,.2,1);
}
body.side-collapsed { grid-template-columns: 1fr 0px; }

.mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
header {
  grid-area: header;
  display: flex; align-items: center; padding: 0 16px; gap: 12px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  font-family: ui-monospace, monospace; font-size: 12px;
  transition: background 400ms, border-color 400ms;
  z-index: 5;
}
.brand {
  font-weight: 700; color: var(--accent); letter-spacing: 0.4px;
  display: flex; align-items: center; gap: 9px;
}
.brand::before {
  content: ""; width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 12px var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.target { color: var(--muted); font-size: 11px; }
.spacer { flex: 1; }
.counts { display: flex; gap: 14px; font-size: 11px; }
.count { display: flex; align-items: center; gap: 5px; color: var(--muted); }
.count b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.count.v b { color: var(--crit); }
.count.s b { color: var(--med); }
.count.p b { color: var(--ok); }
.count.u b { color: var(--dimmer); }
.count .dot { width: 6px; height: 6px; border-radius: 50%; }
.count.v .dot { background: var(--crit); }
.count.s .dot { background: var(--med); }
.count.p .dot { background: var(--ok); }
.count.u .dot { background: var(--dimmer); }

.theme-btn, .icon-btn {
  appearance: none; background: transparent; border: 1px solid var(--border);
  color: var(--muted); border-radius: 6px;
  font-family: inherit; font-size: 10px; cursor: pointer;
  transition: all 200ms; letter-spacing: 0.4px;
}
.theme-btn { padding: 5px 10px; }
.icon-btn {
  width: 28px; height: 26px; font-size: 12px;
  display: inline-flex; align-items: center; justify-content: center;
}
.theme-btn:hover, .icon-btn:hover { color: var(--fg); border-color: var(--border-hi); }
.icon-btn.off { opacity: 0.38; }
.icon-btn.off:hover { opacity: 0.75; }

.status-badge {
  padding: 4px 12px; border-radius: 12px; font-size: 10px;
  font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
  background: rgba(88,166,255,0.08); color: var(--accent);
  border: 1px solid rgba(88,166,255,0.25); transition: all 300ms;
}
.status-badge.running { animation: pulse 1.4s infinite; }
.status-badge.done {
  background: rgba(63,185,80,0.08); color: var(--ok);
  border-color: rgba(63,185,80,0.25);
}
body.theme-light .status-badge {
  background: rgba(217,138,0,0.08); border-color: rgba(217,138,0,0.25);
}
body.theme-light .status-badge.done {
  background: rgba(47,158,95,0.08); border-color: rgba(47,158,95,0.25);
}

/* ═══════════════════════════════════════════════════════════
   CHART
   ═══════════════════════════════════════════════════════════ */
.chart-wrap {
  grid-area: chart;
  position: relative; overflow: hidden; min-width: 0; min-height: 0;
  background:
    radial-gradient(ellipse at 45% 45%, rgba(88,166,255,0.035), transparent 60%),
    linear-gradient(0deg, transparent 0, transparent 39px, var(--grid) 39px, var(--grid) 40px),
    linear-gradient(90deg, transparent 0, transparent 39px, var(--grid) 39px, var(--grid) 40px),
    var(--bg);
  background-size: auto, 40px 40px, 40px 40px, auto;
  transition: background 400ms;
}
svg#chart { display: block; width: 100%; height: 100%; }

.node rect {
  fill: var(--panel2); stroke: var(--border); stroke-width: 1.5;
  transition: fill 280ms, stroke 280ms, stroke-width 280ms, filter 280ms;
}
.node text {
  font-family: ui-monospace, monospace; fill: var(--fg);
  dominant-baseline: middle; text-anchor: middle;
  transition: fill 280ms; user-select: none; pointer-events: none;
}
.node .node-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.5px; }
.node .node-meta { font-size: 9.5px; fill: var(--muted); letter-spacing: 0.3px; }

.node.pending rect { stroke-dasharray: 4 5; opacity: 0.7; }
.node.pending text { fill: var(--muted); }
.node.active rect {
  stroke: var(--fg); stroke-width: 2.2; fill: var(--panel2);
  filter: drop-shadow(0 0 14px rgba(88,166,255,0.5));
  animation: nodePulse 1.1s ease-in-out infinite;
}
.node.active text { fill: var(--fg); }
@keyframes nodePulse { 0%,100%{stroke-opacity:1} 50%{stroke-opacity:0.4} }

.node.done-pass rect { stroke: var(--ok); fill: rgba(63,185,80,0.07); }
.node.done-pass .node-label { fill: var(--ok); }
.node.done-pass .node-meta { fill: var(--ok); opacity: 0.7; }

.node.done-susp rect {
  stroke: var(--med); stroke-width: 2; fill: rgba(210,153,34,0.1);
  filter: drop-shadow(0 0 14px rgba(210,153,34,0.4));
}
.node.done-susp .node-label { fill: var(--med); }
.node.done-susp .node-meta { fill: var(--med); }

.node.done-vuln rect {
  stroke: var(--crit); stroke-width: 2.4; fill: rgba(248,81,73,0.12);
  filter: drop-shadow(0 0 18px rgba(248,81,73,0.6));
}
.node.done-vuln .node-label { fill: var(--crit); }
.node.done-vuln .node-meta { fill: var(--crit); }

.node.skipped rect { stroke-dasharray: 3 5; stroke: var(--dimmer); opacity: 0.45; }
.node.skipped text { fill: var(--dimmer); }

.node.flash-vuln rect { animation: flashRed 800ms ease-out; }
.node.flash-susp rect { animation: flashAmber 800ms ease-out; }
.node.flash-pass rect { animation: flashGreen 700ms ease-out; }
@keyframes flashRed {
  0% { stroke-width: 6; filter: drop-shadow(0 0 30px rgba(248,81,73,0.9)); }
  100% { stroke-width: 2.4; filter: drop-shadow(0 0 18px rgba(248,81,73,0.6)); }
}
@keyframes flashAmber {
  0% { stroke-width: 6; filter: drop-shadow(0 0 28px rgba(210,153,34,0.8)); }
  100% { stroke-width: 2; filter: drop-shadow(0 0 14px rgba(210,153,34,0.4)); }
}
@keyframes flashGreen {
  0% { stroke-width: 5; filter: drop-shadow(0 0 24px rgba(63,185,80,0.7)); }
  100% { stroke-width: 1.5; filter: drop-shadow(0 0 0 rgba(63,185,80,0)); }
}

.edge { fill: none; stroke: var(--border); stroke-width: 1.5;
  transition: stroke 280ms, stroke-width 280ms; }
.edge.pending { stroke-dasharray: 4 7; opacity: 0.45; }
.edge.active { stroke: var(--fg); stroke-width: 2.2;
  stroke-dasharray: 9 7; animation: dashFlow 0.55s linear infinite; }
.edge.done-pass { stroke: rgba(63,185,80,0.65); stroke-width: 1.6; }
.edge.done-susp { stroke: var(--med); stroke-width: 2; }
.edge.done-vuln { stroke: var(--crit); stroke-width: 2.2; }
@keyframes dashFlow { to { stroke-dashoffset: -16; } }

.packet { fill: var(--fg); }
.packet.prompt { fill: var(--prompt); filter: drop-shadow(0 0 6px var(--prompt)); }
.packet.response { fill: var(--ok); filter: drop-shadow(0 0 6px var(--ok)); }
.packet.susp { fill: var(--med); filter: drop-shadow(0 0 6px var(--med)); }
.packet.vuln { fill: var(--crit); filter: drop-shadow(0 0 8px var(--crit)); }
.packet.data { fill: var(--accent2); filter: drop-shadow(0 0 5px var(--accent2)); }
.packet.trail { opacity: 0.4; }

/* AI NODE */
.node.ai rect.ai-body {
  fill: var(--panel2); stroke: var(--border-hi); stroke-width: 1.5;
}
.node.ai.online rect.ai-body {
  stroke: var(--accent);
  filter: drop-shadow(0 0 22px rgba(88,166,255,0.35));
}
.node.ai.offline rect.ai-body {
  stroke: var(--dimmer);
  filter: drop-shadow(0 0 4px rgba(74,83,97,0.3));
}
.node.ai.queried rect.ai-body { animation: aiQuery 1.2s ease-out; }
@keyframes aiQuery {
  0% { stroke-width: 3.5; filter: drop-shadow(0 0 40px rgba(121,192,255,0.9)); }
  100% { stroke-width: 1.5; filter: drop-shadow(0 0 22px rgba(88,166,255,0.35)); }
}
.ai-ring { fill: none; stroke: var(--border-hi); stroke-width: 1; opacity: 0.85; }
.ai-ring.inner { stroke-dasharray: 3 5; }
.node.ai.online .ai-ring { stroke: var(--accent); opacity: 0.55; }
.node.ai.online .ai-ring.outer {
  animation: aiRotate 22s linear infinite;
  transform-box: fill-box; transform-origin: center;
}
.node.ai.online .ai-ring.mid {
  animation: aiRotate 14s linear infinite reverse;
  transform-box: fill-box; transform-origin: center;
}
.node.ai.queried .ai-ring.outer { animation: aiRotate 1.2s linear infinite; }
.node.ai.queried .ai-ring.mid { animation: aiRotate 0.8s linear infinite reverse; }
@keyframes aiRotate { to { transform: rotate(360deg); } }

.ai-core-dot { fill: var(--accent); }
.node.ai.queried .ai-core-dot {
  animation: corePulse 1s ease-out infinite;
  transform-box: fill-box; transform-origin: center;
}
.node.ai.online .ai-core-dot {
  animation: corePulse 2.5s ease-out infinite;
  transform-box: fill-box; transform-origin: center;
}
@keyframes corePulse {
  0% { r: 6; opacity: 1; }
  100% { r: 24; opacity: 0; }
}
.ai-icon { font-size: 22px; fill: var(--accent); font-family: monospace;
  text-anchor: middle; pointer-events: none; }
.node.ai.offline .ai-icon { fill: var(--dimmer); }
.ai-title { font-family: monospace; font-size: 11px; font-weight: 700;
  fill: var(--fg); text-anchor: middle; letter-spacing: 1px; }
.ai-subtitle { font-family: monospace; font-size: 9px;
  fill: var(--muted); text-anchor: middle; letter-spacing: 0.5px; }
.node.ai.online .ai-subtitle { fill: var(--accent); }
.ai-cap-list { font-family: monospace; font-size: 9px;
  fill: var(--muted); text-anchor: start; }
.ai-cap-list .active { fill: var(--accent); font-weight: 700; }
.ai-cap-list .hit { fill: var(--ok); }

/* Data labels on edges */
.data-label { font-family: monospace; font-size: 9.5px;
  text-anchor: middle; pointer-events: none;
  opacity: 0; transition: opacity 350ms; }
.data-label.show { opacity: 1; }
.data-label.prompt { fill: var(--prompt); }
.data-label.response { fill: var(--ok); }
.data-label.susp { fill: var(--med); }
.data-label.vuln { fill: var(--crit); }
.data-label.data { fill: var(--accent2); }

/* ═══════════════════════════════════════════════════════════
   RIGHT SIDEBAR
   ═══════════════════════════════════════════════════════════ */
.side {
  grid-area: side;
  display: flex; flex-direction: column;
  background: var(--panel); border-left: 1px solid var(--border);
  min-height: 0; min-width: 0; overflow: hidden;
  transition: background 400ms, border-color 400ms, opacity 260ms;
}
body.side-collapsed .side {
  opacity: 0; pointer-events: none; border-left-width: 0;
}
.panel-section { border-bottom: 1px solid var(--border); padding: 12px 14px; flex-shrink: 0; }
.panel-section.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.panel-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--muted); font-weight: 700; margin-bottom: 9px;
}
.ai-status {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; background: var(--panel2);
  border-radius: 8px; border: 1px solid var(--border);
  transition: border-color 400ms;
}
.ai-status.online { border-color: rgba(88,166,255,0.4); }
.ai-status.thinking { border-color: rgba(88,166,255,0.6); }
.ai-status .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--dimmer); flex-shrink: 0;
  transition: background 300ms, box-shadow 300ms;
}
.ai-status.online .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 2s infinite; }
.ai-status.thinking .dot { background: var(--accent); box-shadow: 0 0 14px var(--accent); animation: pulse 0.6s infinite; }
.ai-status .info { flex: 1; min-width: 0; }
.ai-status .label { font-size: 12px; font-weight: 600; letter-spacing: 0.3px; }
.ai-status .sub { font-family: monospace; font-size: 10px;
  color: var(--muted); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* AI capability chips */
.cap-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.cap-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 10px;
  font-family: monospace; font-size: 9.5px;
  background: var(--panel2); border: 1px solid var(--border);
  color: var(--muted); transition: all 300ms;
}
.cap-chip .cd { width: 5px; height: 5px; border-radius: 50%; background: var(--dimmer); }
.cap-chip.active { border-color: var(--accent); color: var(--accent); }
.cap-chip.active .cd { background: var(--accent); animation: pulse 1s infinite; }
.cap-chip.used { border-color: rgba(63,185,80,0.4); color: var(--ok); }
.cap-chip.used .cd { background: var(--ok); }
.cap-chip .cn { font-variant-numeric: tabular-nums; opacity: 0.7; }

.trace-log {
  flex: 1; overflow-y: auto; padding: 12px 14px;
  font-family: monospace; font-size: 11px; line-height: 1.55;
  min-height: 0;
}
.trace-log::-webkit-scrollbar { width: 6px; }
.trace-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.trace-log::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }
.trace {
  margin-bottom: 12px; opacity: 0;
  animation: fadeIn 400ms ease-out forwards;
}
@keyframes fadeIn { to { opacity: 1; } }
.trace .ts { font-size: 9px; color: var(--dimmer); margin-bottom: 4px; letter-spacing: 0.4px; }
.trace .role {
  display: inline-block; font-size: 9px; font-weight: 700;
  padding: 2px 7px; border-radius: 3px;
  margin-right: 6px; letter-spacing: 0.6px;
}
.trace .role.prompt { background: rgba(121,192,255,0.14); color: var(--prompt);
  border: 1px solid rgba(121,192,255,0.3); }
.trace .role.response { background: rgba(63,185,80,0.14); color: var(--ok);
  border: 1px solid rgba(63,185,80,0.3); }
.trace .role.response.susp { background: rgba(210,153,34,0.14); color: var(--med);
  border-color: rgba(210,153,34,0.3); }
.trace .role.response.vuln { background: rgba(248,81,73,0.14); color: var(--crit);
  border-color: rgba(248,81,73,0.3); }
.trace .role.task {
  background: rgba(121,192,255,0.1); color: var(--accent2);
  border: 1px solid rgba(121,192,255,0.25);
  font-size: 8.5px; text-transform: uppercase;
}
.trace .body {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px; margin-top: 4px;
  color: var(--fg); word-break: break-word; white-space: pre-wrap;
  font-size: 10.5px; max-height: 180px; overflow-y: auto; line-height: 1.5;
}
.trace .body.prompt { border-color: rgba(121,192,255,0.28); }
.trace .body.response { border-color: rgba(63,185,80,0.28); }
.trace .body.susp { border-color: rgba(210,153,34,0.28); }
.trace .body.vuln { border-color: rgba(248,81,73,0.3); }
.trace-empty { color: var(--dimmer); font-size: 11px; font-style: italic;
  text-align: center; padding: 24px 0; }

/* ═══════════════════════════════════════════════════════════
   BOTTOM DOCK  (Narrator + Console, tabbed & collapsible)
   ═══════════════════════════════════════════════════════════ */
.dock {
  grid-area: dock;
  background: var(--panel); border-top: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
  transition: background 400ms, border-color 400ms;
}
.dock-head {
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px; height: 38px; flex-shrink: 0;
  background: var(--panel2); border-bottom: 1px solid var(--border);
  transition: border-color 300ms;
}
.dock.collapsed .dock-head { border-bottom-color: transparent; }
.dock-tab {
  appearance: none; background: transparent; border: 1px solid transparent;
  color: var(--muted); padding: 4px 12px; border-radius: 6px;
  font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700;
  letter-spacing: 1.1px; cursor: pointer; transition: all 200ms;
}
.dock-tab:hover { color: var(--fg); }
.dock-tab.is-active {
  color: var(--accent); background: var(--bg); border-color: var(--border);
}
.dock-spacer { flex: 1; }
.dock-head .th-summary {
  font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted);
  white-space: nowrap;
}
.dock-head .th-summary b { color: var(--fg); font-variant-numeric: tabular-nums; }
.dock-head .th-summary .sv, .dock-head .th-summary b.v { color: var(--crit); }
.dock-head .th-summary .ss, .dock-head .th-summary b.s { color: var(--med); }
.dock-head .th-summary .sp, .dock-head .th-summary b.p { color: var(--ok); }
.dock-head .th-summary .su, .dock-head .th-summary b.u { color: var(--dimmer); }
.dock-head .th-findings {
  font-family: ui-monospace, monospace; font-size: 10px;
  padding: 3px 10px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--border); color: var(--muted);
  transition: all 300ms;
}
.dock-head .th-findings.has {
  background: var(--crit); color: #fff; border-color: var(--crit);
}
.dock-chevron {
  appearance: none; background: transparent; border: 1px solid var(--border);
  color: var(--muted); width: 26px; height: 24px; border-radius: 6px;
  cursor: pointer; font-size: 10px; line-height: 1;
  transition: all 220ms; margin-left: 4px;
}
.dock-chevron:hover { color: var(--fg); border-color: var(--border-hi); }
.dock.collapsed .dock-chevron { transform: rotate(180deg); }

.dock-panes {
  position: relative;
  height: clamp(150px, 26vh, 280px);
  transition: height 320ms cubic-bezier(.2,.8,.2,1);
  overflow: hidden; min-height: 0;
}
.dock.collapsed .dock-panes { height: 0; }
.dock-pane { position: absolute; inset: 0; display: none; }
.dock-pane.is-active { display: block; }

.transcript-body {
  height: 100%; overflow-y: auto; padding: 10px 18px 14px;
  font-family: monospace; font-size: 11.5px; line-height: 1.65;
}
.transcript-body::-webkit-scrollbar { width: 7px; }
.transcript-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.transcript-body::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }

.tr {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 3px 0; opacity: 0;
  animation: trIn 320ms cubic-bezier(.2,.9,.3,1) forwards;
}
@keyframes trIn {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}
.tr .mark {
  flex-shrink: 0; width: 14px; text-align: center;
  font-weight: 700; line-height: 1.65;
}
.tr.step .mark { color: var(--fg); }
.tr.step.done .mark { color: var(--ok); }
.tr.step.vuln .mark { color: var(--crit); }
.tr.step.susp .mark { color: var(--med); }
.tr.step.skip .mark { color: var(--dimmer); }
.tr.sub .mark { color: var(--dimmer); }
.tr.summary .mark { color: var(--accent2); }
.tr .body { flex: 1; min-width: 0; }
.tr.step .body { color: var(--fg); font-weight: 600; }
.tr.step .body .tool { color: var(--muted); font-weight: 400; font-size: 11px; }
.tr.sub .body { color: var(--muted); font-size: 11px; padding-left: 2px; }
.tr.sub .body .t { color: var(--dimmer); font-variant-numeric: tabular-nums; }
.tr.sub .body .chain { color: var(--accent2); }
.tr.sub .body .verdict-pass { color: var(--ok); }
.tr.sub .body .verdict-vuln { color: var(--crit); font-weight: 600; }
.tr.sub .body .verdict-susp { color: var(--med); font-weight: 600; }
.tr.sub .body .verdict-unknown { color: var(--dimmer); }
.tr.summary .body {
  color: var(--fg); font-weight: 600; padding: 4px 0 2px;
  border-top: 1px dashed var(--border); margin-top: 4px;
}
.tr.summary .body b.v { color: var(--crit); }
.tr.summary .body b.s { color: var(--med); }
.tr.summary .body b.p { color: var(--ok); }
.tr.summary .body b.u { color: var(--dimmer); }
.tr .ai-tag {
  display: inline-block; margin-left: 6px;
  font-size: 9px; padding: 1px 6px; border-radius: 8px;
  background: rgba(121,192,255,0.14); color: var(--prompt);
  border: 1px solid rgba(121,192,255,0.3); font-weight: 700;
  letter-spacing: 0.5px; vertical-align: middle;
}
body.theme-light .tr .ai-tag {
  background: rgba(74,127,217,0.12); color: #4a7fd9;
  border-color: rgba(74,127,217,0.3);
}
.tr .ai-finding {
  display: block; margin-top: 3px; padding-left: 10px;
  border-left: 2px solid var(--prompt);
  color: var(--accent2); font-size: 11px;
}
body.theme-light .tr .ai-finding { color: #4a7fd9; }

/* ═══════════════════════════════════════════════════════════
   CONSOLE (inside the dock pane)
   ═══════════════════════════════════════════════════════════ */
.console {
  height: 100%; overflow-y: auto; padding: 9px 18px 12px;
  font-family: monospace; font-size: 11px; line-height: 1.6;
  display: flex; flex-direction: column; gap: 1px;
}
.console::-webkit-scrollbar { width: 7px; }
.console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.console-line {
  display: flex; gap: 12px; color: var(--muted); flex: 0 0 auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; animation: fadeIn 280ms ease-out forwards;
}
.console-line .t { color: var(--dimmer); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.console-line .src { color: var(--accent2); flex-shrink: 0; min-width: 110px; }
.console-line .msg { color: var(--fg); overflow: hidden; text-overflow: ellipsis; }
.console-line.ok .msg { color: var(--ok); }
.console-line.warn .msg { color: var(--med); }
.console-line.err .msg { color: var(--crit); }
.console-line.hi .msg { color: var(--accent2); font-weight: 600; }
</style>
</head>
<body class="theme-dark">

<header>
  <span class="brand">sec-checker</span>
  <span class="target mono" id="hTarget">—</span>
  <span class="spacer"></span>
  <div class="counts mono">
    <div class="count v"><span class="dot"></span>V <b id="cV">0</b></div>
    <div class="count s"><span class="dot"></span>S <b id="cS">0</b></div>
    <div class="count p"><span class="dot"></span>P <b id="cP">0</b></div>
    <div class="count u"><span class="dot"></span>U <b id="cU">0</b></div>
  </div>
  <button class="icon-btn" id="dockToggle" title="Toggle bottom panel">▤</button>
  <button class="icon-btn" id="sideToggle" title="Toggle AI sidebar">◧</button>
  <button class="theme-btn" id="themeToggle">◐ LIGHT</button>
  <span class="status-badge" id="hStatus">idle</span>
</header>

<div class="chart-wrap">
  <!-- viewBox tightened to the real content bounds (≈ 10..1058 × 50..940)
       instead of the old 1500×1000 canvas → ~40% bigger effective scale -->
  <svg id="chart" viewBox="10 50 1048 890" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="edges"></g>
    <g id="packets"></g>
    <g id="nodes"></g>
    <g id="labels"></g>
  </svg>
</div>

<aside class="side">
  <div class="panel-section">
    <div class="panel-title">AI Brain</div>
    <div class="ai-status offline" id="aiStatus">
      <span class="dot"></span>
      <div class="info">
        <div class="label" id="aiLabel">Checking…</div>
        <div class="sub" id="aiSub">initializing</div>
      </div>
    </div>
    <div class="cap-chips" id="capChips">
      <span class="cap-chip" data-cap="payload_author"><span class="cd"></span>payload author <span class="cn">0</span></span>
      <span class="cap-chip" data-cap="bundle_analyst"><span class="cd"></span>bundle analyst <span class="cn">0</span></span>
      <span class="cap-chip" data-cap="response_triage"><span class="cd"></span>response triage <span class="cn">0</span></span>
      <span class="cap-chip" data-cap="chain_synth"><span class="cd"></span>chain synth <span class="cn">0</span></span>
      <span class="cap-chip" data-cap="exploit_plan"><span class="cd"></span>exploit plan <span class="cn">0</span></span>
      <span class="cap-chip" data-cap="narrative"><span class="cd"></span>narrative <span class="cn">0</span></span>
    </div>
  </div>
  <div class="panel-section grow">
    <div class="panel-title">Prompt / Response Trace</div>
    <div class="trace-log" id="traceLog">
      <div class="trace-empty">No LLM activity yet…</div>
    </div>
  </div>
</aside>

<section class="dock" id="dock">
  <div class="dock-head">
    <button class="dock-tab is-active" data-tab="narrator">NARRATOR</button>
    <button class="dock-tab" data-tab="console">CONSOLE</button>
    <span class="dock-spacer"></span>
    <span class="th-summary mono" id="thSummary">
      <b>0</b> vuln · <b>0</b> susp · <b>0</b> pass · <b>0</b> unknown
    </span>
    <span class="th-findings mono" id="thFindings">findings 0</span>
    <button class="dock-chevron" id="dockChevron" title="Collapse / expand panel">▾</button>
  </div>
  <div class="dock-panes">
    <div class="dock-pane is-active" data-pane="narrator">
      <div class="transcript-body" id="transcriptBody"></div>
    </div>
    <div class="dock-pane" data-pane="console">
      <div class="console mono" id="console"></div>
    </div>
  </div>
</section>

<script>
(function(){
'use strict';

const NS = 'http://www.w3.org/2000/svg';

/* ═══════════════════════════════════════════════════════════════
   NODES
   ═══════════════════════════════════════════════════════════════ */
const NODES = {
  start:       { x:  40, y:  80, w:  84, h:  56, label: 'START',       kind: 'terminal' },
  preflight:   { x: 160, y:  80, w: 116, h:  56, label: 'PREFLIGHT',   kind: 'phase' },
  fingerprint: { x: 312, y:  80, w: 140, h:  56, label: 'FINGERPRINT', kind: 'phase' },
  discovery:   { x: 488, y:  80, w: 128, h:  56, label: 'DISCOVERY',   kind: 'phase' },
  login:       { x: 652, y:  80, w:  96, h:  56, label: 'LOGIN',       kind: 'phase' },
  propose:     { x: 784, y:  80, w: 118, h:  56, label: 'PROPOSE',     kind: 'phase' },

  ai:          { x: 570, y: 220, w: 400, h: 240, label: 'AI BRAIN',    kind: 'ai' },

  jwt:         { x:  60, y: 580, w: 168, h:  76, label: 'JWT',         kind: 'chain' },
  graphql:     { x: 260, y: 580, w: 168, h:  76, label: 'GRAPHQL',     kind: 'chain' },
  ssrf:        { x: 460, y: 580, w: 168, h:  76, label: 'SSRF',        kind: 'chain' },
  bizlogic:    { x: 660, y: 580, w: 168, h:  76, label: 'BIZLOGIC',    kind: 'chain' },
  race:        { x: 860, y: 580, w: 168, h:  76, label: 'RACE',        kind: 'chain' },

  report:      { x: 400, y: 830, w: 240, h:  72, label: 'REPORT',      kind: 'terminal' },
  findings:    { x: 700, y: 830, w: 240, h:  72, label: 'FINDINGS',    kind: 'terminal' },
};

const EDGES = [
  { id: 'e-1', from: 'start',       to: 'preflight',   kind: 'h' },
  { id: 'e-2', from: 'preflight',   to: 'fingerprint', kind: 'h' },
  { id: 'e-3', from: 'fingerprint', to: 'discovery',   kind: 'h' },
  { id: 'e-4', from: 'discovery',   to: 'login',       kind: 'h' },
  { id: 'e-5', from: 'login',       to: 'propose',     kind: 'h' },
  { id: 'e-6', from: 'propose',     to: 'ai',          kind: 'down' },
  { id: 'e-a1', from: 'ai', to: 'jwt',      kind: 'fan' },
  { id: 'e-a2', from: 'ai', to: 'graphql',  kind: 'fan' },
  { id: 'e-a3', from: 'ai', to: 'ssrf',     kind: 'fan' },
  { id: 'e-a4', from: 'ai', to: 'bizlogic', kind: 'fan' },
  { id: 'e-a5', from: 'ai', to: 'race',     kind: 'fan' },
  { id: 'e-r1', from: 'jwt',      to: 'report', kind: 'converge' },
  { id: 'e-r2', from: 'graphql',  to: 'report', kind: 'converge' },
  { id: 'e-r3', from: 'ssrf',     to: 'report', kind: 'converge' },
  { id: 'e-r4', from: 'bizlogic', to: 'report', kind: 'converge' },
  { id: 'e-r5', from: 'race',     to: 'report', kind: 'converge' },
  { id: 'e-rf', from: 'report',   to: 'findings', kind: 'h-short' },
];

function computePath(e) {
  const a = NODES[e.from], b = NODES[e.to];
  if (e.kind === 'h' || e.kind === 'h-short') {
    const p1 = { x: a.x + a.w, y: a.y + a.h / 2 };
    const p2 = { x: b.x, y: b.y + b.h / 2 };
    const c = Math.max(40, (p2.x - p1.x) * 0.5);
    return `M ${p1.x} ${p1.y} C ${p1.x + c} ${p1.y}, ${p2.x - c} ${p2.y}, ${p2.x} ${p2.y}`;
  }
  if (e.kind === 'down') {
    const p1 = { x: a.x + a.w * 0.55, y: a.y + a.h };
    const p2 = { x: b.x + b.w * 0.5, y: b.y };
    const my = (p1.y + p2.y) * 0.5;
    return `M ${p1.x} ${p1.y} C ${p1.x} ${my}, ${p2.x} ${my}, ${p2.x} ${p2.y}`;
  }
  if (e.kind === 'fan') {
    const p1 = { x: a.x + a.w * 0.5, y: a.y + a.h };
    const p2 = { x: b.x + b.w * 0.5, y: b.y };
    const my = (p1.y + p2.y) * 0.55;
    return `M ${p1.x} ${p1.y} C ${p1.x} ${my}, ${p2.x} ${my}, ${p2.x} ${p2.y}`;
  }
  if (e.kind === 'converge') {
    const p1 = { x: a.x + a.w * 0.5, y: a.y + a.h };
    const p2 = { x: b.x + b.w * 0.5, y: b.y };
    const my = (p1.y + p2.y) * 0.45;
    return `M ${p1.x} ${p1.y} C ${p1.x} ${my}, ${p2.x} ${my}, ${p2.x} ${p2.y}`;
  }
  return '';
}

/* ═══════════════════════════════════════════════════════════════
   BUILD SVG
   ═══════════════════════════════════════════════════════════════ */
const svg = document.getElementById('chart');
const edgesG = document.getElementById('edges');
const packetsG = document.getElementById('packets');
const nodesG = document.getElementById('nodes');
const labelsG = document.getElementById('labels');

const edgeEls = {}, edgePaths = {}, nodeEls = {}, nodeMeta = {}, labelEls = {};

EDGES.forEach(e => {
  const d = computePath(e);
  edgePaths[e.id] = d;
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('class', 'edge pending');
  p.setAttribute('d', d);
  edgesG.appendChild(p);
  edgeEls[e.id] = p;
});

Object.entries(NODES).forEach(([id, n]) => {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', `node pending ${n.kind}`);
  g.setAttribute('id', 'node-' + id);

  if (n.kind === 'ai') {
    const cx = n.x + n.w / 2;
    const cy = n.y + n.h / 2;

    const body = document.createElementNS(NS, 'rect');
    body.setAttribute('x', n.x); body.setAttribute('y', n.y);
    body.setAttribute('width', n.w); body.setAttribute('height', n.h);
    body.setAttribute('rx', 20);
    body.setAttribute('class', 'ai-body');
    g.appendChild(body);

    const ringR = [78, 58, 38];
    ringR.forEach((r, i) => {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy + 14);
      c.setAttribute('r', r);
      let cls = 'ai-ring';
      if (i === 0) cls += ' outer';
      if (i === 1) cls += ' mid';
      if (i === 2) cls += ' inner';
      c.setAttribute('class', cls);
      g.appendChild(c);
    });

    const core = document.createElementNS(NS, 'circle');
    core.setAttribute('cx', cx); core.setAttribute('cy', cy + 14);
    core.setAttribute('r', 6);
    core.setAttribute('class', 'ai-core-dot');
    g.appendChild(core);

    const icon = document.createElementNS(NS, 'text');
    icon.setAttribute('x', cx); icon.setAttribute('y', cy + 14);
    icon.setAttribute('class', 'ai-icon');
    icon.textContent = '◉';
    g.appendChild(icon);

    const title = document.createElementNS(NS, 'text');
    title.setAttribute('x', cx); title.setAttribute('y', n.y + 24);
    title.setAttribute('class', 'ai-title');
    title.textContent = 'AI BRAIN';
    g.appendChild(title);

    const capList = document.createElementNS(NS, 'text');
    capList.setAttribute('x', n.x + 22);
    capList.setAttribute('y', n.y + 44);
    capList.setAttribute('class', 'ai-cap-list');
    capList.setAttribute('id', 'aiCapList');
    capList.textContent = '';
    g.appendChild(capList);

    const sub = document.createElementNS(NS, 'text');
    sub.setAttribute('x', cx); sub.setAttribute('y', n.y + n.h - 18);
    sub.setAttribute('class', 'ai-subtitle');
    sub.textContent = 'offline';
    g.appendChild(sub);
    nodeMeta[id] = sub;

    ['payload author', 'bundle analyst', 'response triage',
     'chain synth', 'exploit plan', 'narrative'].forEach((label, i) => {
      const t = document.createElementNS(NS, 'tspan');
      t.setAttribute('x', n.x + 22);
      t.setAttribute('dy', i === 0 ? 0 : '12');
      t.setAttribute('class', 'ai-cap-line');
      t.setAttribute('data-cap', label.replace(/ /g, '_'));
      t.textContent = '· ' + label;
      capList.appendChild(t);
    });
  } else {
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', n.x); rect.setAttribute('y', n.y);
    rect.setAttribute('width', n.w); rect.setAttribute('height', n.h);
    rect.setAttribute('rx', 8);
    g.appendChild(rect);

    const hasMeta = n.kind === 'chain';
    const labelY = hasMeta ? n.y + n.h / 2 - 9 : n.y + n.h / 2;
    const label = document.createElementNS(NS, 'text');
    label.setAttribute('x', n.x + n.w / 2); label.setAttribute('y', labelY);
    label.setAttribute('class', 'node-label');
    label.textContent = n.label;
    g.appendChild(label);

    if (hasMeta) {
      const meta = document.createElementNS(NS, 'text');
      meta.setAttribute('x', n.x + n.w / 2); meta.setAttribute('y', n.y + n.h / 2 + 10);
      meta.setAttribute('class', 'node-meta');
      meta.textContent = '· idle';
      g.appendChild(meta);
      nodeMeta[id] = meta;
    }
  }
  nodesG.appendChild(g);
  nodeEls[id] = g;
});

/* ═══════════════════════════════════════════════════════════════
   STATE MUTATORS
   ═══════════════════════════════════════════════════════════════ */
function setNode(id, state, meta) {
  const el = nodeEls[id];
  if (!el) return;
  const kindMatch = el.getAttribute('class').match(/(terminal|phase|chain|ai)/);
  const kind = kindMatch ? kindMatch[1] : '';
  const aiState = el.classList.contains('online') ? ' online' :
                  el.classList.contains('offline') ? ' offline' : '';
  el.setAttribute('class', `node ${state} ${kind}${kind === 'ai' ? aiState : ''}`);

  if (state === 'done-vuln') flash(el, 'flash-vuln');
  else if (state === 'done-susp') flash(el, 'flash-susp');
  else if (state === 'done-pass') flash(el, 'flash-pass');

  if (meta !== undefined && nodeMeta[id] && id !== 'ai') {
    nodeMeta[id].textContent = meta || '';
  }
}

function flash(el, cls) {
  el.classList.remove('flash-vuln','flash-susp','flash-pass');
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 900);
}

function setEdge(id, state) {
  const p = edgeEls[id];
  if (!p) return;
  p.setAttribute('class', `edge ${state}`);
}

function setAIState(state, subText) {
  const el = nodeEls['ai'];
  if (!el) return;
  el.classList.remove('online','offline','queried');
  el.classList.add(state);
  if (state === 'queried') el.classList.add('online');
  if (subText !== undefined && nodeMeta['ai']) {
    nodeMeta['ai'].textContent = subText;
  }
}

/* ═══════════════════════════════════════════════════════════════
   PACKETS
   ═══════════════════════════════════════════════════════════════ */
function firePacket(edgeId, colorClass, dur) {
  dur = dur || 700;
  const d = edgePaths[edgeId];
  if (!d) return;
  const packet = document.createElementNS(NS, 'circle');
  packet.setAttribute('r', 4.5);
  packet.setAttribute('class', 'packet ' + (colorClass || ''));
  packet.setAttribute('filter', 'url(#glow)');
  const motion = document.createElementNS(NS, 'animateMotion');
  motion.setAttribute('dur', dur + 'ms');
  motion.setAttribute('fill', 'freeze');
  motion.setAttribute('path', d);
  packet.appendChild(motion);
  packetsG.appendChild(packet);
  setTimeout(() => packet.remove(), dur + 150);

  const trail = document.createElementNS(NS, 'circle');
  trail.setAttribute('r', 2.5);
  trail.setAttribute('class', 'packet trail ' + (colorClass || ''));
  const tmotion = document.createElementNS(NS, 'animateMotion');
  tmotion.setAttribute('dur', (dur * 1.15) + 'ms');
  tmotion.setAttribute('fill', 'freeze');
  tmotion.setAttribute('path', d);
  trail.appendChild(tmotion);
  packetsG.appendChild(trail);
  setTimeout(() => trail.remove(), (dur * 1.15) + 150);
}

function showLabel(edgeId, text, kind, dur) {
  dur = dur || 2500;
  const old = labelEls[edgeId];
  if (old && old.parentNode) old.parentNode.removeChild(old);
  const p = edgeEls[edgeId];
  if (!p) return;
  const len = p.getTotalLength();
  const pt = p.getPointAtLength(len * 0.5);
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', pt.x); t.setAttribute('y', pt.y - 8);
  t.setAttribute('class', 'data-label ' + (kind || 'data'));
  t.textContent = text;
  labelsG.appendChild(t);
  labelEls[edgeId] = t;
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 400);
  }, dur);
}

/* ═══════════════════════════════════════════════════════════════
   HEADER COUNTERS
   ═══════════════════════════════════════════════════════════════ */
const counts = { v: 0, s: 0, p: 0, u: 0 };
function bumpCount(kind) {
  counts[kind] = (counts[kind] || 0) + 1;
  document.getElementById('cV').textContent = counts.v;
  document.getElementById('cS').textContent = counts.s;
  document.getElementById('cP').textContent = counts.p;
  document.getElementById('cU').textContent = counts.u;
  document.getElementById('thSummary').innerHTML =
    `<b class="v">${counts.v}</b> vuln · ` +
    `<b class="s">${counts.s}</b> susp · ` +
    `<b class="p">${counts.p}</b> pass · ` +
    `<b class="u">${counts.u}</b> unknown`;
}

const statusBadge = document.getElementById('hStatus');
function setStatus(text, cls) {
  statusBadge.textContent = text;
  statusBadge.className = 'status-badge ' + (cls || '');
}

/* ═══════════════════════════════════════════════════════════════
   CONSOLE — append-only, keeps scroll pinned to bottom
   ═══════════════════════════════════════════════════════════════ */
const consoleEl = document.getElementById('console');
const MAX_CONSOLE = 400;
function log(src, msg, cls) {
  const t = new Date().toTimeString().slice(0,8);
  const el = document.createElement('div');
  el.className = 'console-line ' + (cls || '');
  el.innerHTML =
    `<span class="t">${t}</span>` +
    `<span class="src">${escape(src)}</span>` +
    `<span class="msg">${escape(msg)}</span>`;
  consoleEl.appendChild(el);
  while (consoleEl.children.length > MAX_CONSOLE) {
    consoleEl.removeChild(consoleEl.firstChild);
  }
  consoleEl.scrollTop = consoleEl.scrollHeight;
}
function escape(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ═══════════════════════════════════════════════════════════════
   AI PANEL — status, cap chips, trace
   ═══════════════════════════════════════════════════════════════ */
const aiStatusEl = document.getElementById('aiStatus');
const aiLabelEl  = document.getElementById('aiLabel');
const aiSubEl    = document.getElementById('aiSub');
const traceLogEl = document.getElementById('traceLog');
const capChips   = document.querySelectorAll('.cap-chip');
const capCounts  = {};

function setAIPanel(state, label, sub) {
  aiStatusEl.className = 'ai-status ' + state;
  aiLabelEl.textContent = label;
  aiSubEl.textContent = sub || '';
}

function clearTrace() {
  traceLogEl.innerHTML = '<div class="trace-empty">No LLM activity yet…</div>';
}

function bumpCap(cap, isActive) {
  capCounts[cap] = (capCounts[cap] || 0) + (isActive ? 0 : 1);
  capChips.forEach(chip => {
    if (chip.getAttribute('data-cap') === cap) {
      chip.classList.toggle('active', isActive);
      if (!isActive && capCounts[cap] > 0) chip.classList.add('used');
      chip.querySelector('.cn').textContent = capCounts[cap];
    }
  });
  const lines = document.querySelectorAll('.ai-cap-line');
  lines.forEach(l => {
    if (l.getAttribute('data-cap') === cap) {
      l.classList.toggle('active', isActive);
      if (!isActive) l.classList.add('hit');
    }
  });
}

function appendTrace(role, text, kind, extra, taskName) {
  const empty = traceLogEl.querySelector('.trace-empty');
  if (empty) empty.remove();

  const t = new Date().toTimeString().slice(0,8);
  const wrap = document.createElement('div');
  wrap.className = 'trace';

  let roleHtml = '';
  if (role === 'PROMPT') {
    roleHtml = `<span class="role prompt">PROMPT</span>`;
  } else if (role === 'RESPONSE') {
    roleHtml = `<span class="role response ${kind || ''}">RESPONSE</span>`;
  } else if (role === 'TASK') {
    roleHtml = `<span class="role task">${escape(taskName || 'task')}</span>`;
  }

  const bodyCls = 'body ' + (role === 'PROMPT' ? 'prompt' : 'response ' + (kind || ''));

  wrap.innerHTML =
    `<div class="ts">${t}${extra ? ' · ' + escape(extra) : ''}</div>` +
    roleHtml +
    `<div class="${bodyCls}">${escape(text)}</div>`;

  traceLogEl.appendChild(wrap);
  traceLogEl.scrollTop = traceLogEl.scrollHeight;
}

/* ═══════════════════════════════════════════════════════════════
   TRANSCRIPT
   ═══════════════════════════════════════════════════════════════ */
const transcriptBody = document.getElementById('transcriptBody');
const transcriptLines = [];

function trStep(text, tool, state) {
  const mark = state === 'running' ? '▸' :
               state === 'vuln' ? '✗' :
               state === 'susp' ? '?' :
               state === 'skip' ? '—' : '✓';
  const el = document.createElement('div');
  el.className = 'tr step ' + (state || '');
  const toolHtml = tool ? ` <span class="tool">(${escape(tool)})</span>` : '';
  el.innerHTML = `<span class="mark">${mark}</span><span class="body">${escape(text)}${toolHtml}</span>`;
  transcriptBody.appendChild(el);
  scrollTranscript();
  transcriptLines.push(el);
}

function trSub(text, opts) {
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'tr sub';
  const aiTag = opts.ai ? `<span class="ai-tag">AI · ${escape(opts.ai)}</span>` : '';
  let bodyHtml = escape(text);
  if (opts.t) bodyHtml += ` <span class="t">(${escape(opts.t)})</span>`;
  let extra = '';
  if (opts.ai_findings && opts.ai_findings.length) {
    extra = opts.ai_findings.map(f =>
      `<span class="ai-finding">→ ${escape(f)}</span>`).join('');
  }
  el.innerHTML =
    `<span class="mark">·</span><span class="body">${bodyHtml}${aiTag}${extra}</span>`;
  transcriptBody.appendChild(el);
  scrollTranscript();
  transcriptLines.push(el);
}

function trSummary(textHtml) {
  const el = document.createElement('div');
  el.className = 'tr summary';
  el.innerHTML = `<span class="mark">◆</span><span class="body">${textHtml}</span>`;
  transcriptBody.appendChild(el);
  scrollTranscript();
  transcriptLines.push(el);
}

function scrollTranscript() {
  transcriptBody.scrollTop = transcriptBody.scrollHeight;
}

function setFindingsCount(n) {
  const el = document.getElementById('thFindings');
  el.textContent = `findings ${n}`;
  el.classList.toggle('has', n > 0);
}

/* ═══════════════════════════════════════════════════════════════
   PANEL TOGGLES — dock + sidebar
   ═══════════════════════════════════════════════════════════════ */
const dockEl      = document.getElementById('dock');
const dockToggle  = document.getElementById('dockToggle');
const dockChevron = document.getElementById('dockChevron');
const sideToggle  = document.getElementById('sideToggle');

function setDockCollapsed(collapsed) {
  dockEl.classList.toggle('collapsed', collapsed);
  dockToggle.classList.toggle('off', collapsed);
}
function toggleDock() { setDockCollapsed(!dockEl.classList.contains('collapsed')); }
dockToggle.addEventListener('click', toggleDock);
dockChevron.addEventListener('click', toggleDock);

document.querySelectorAll('.dock-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.dock-tab').forEach(t =>
      t.classList.toggle('is-active', t === tab));
    const name = tab.dataset.tab;
    document.querySelectorAll('.dock-pane').forEach(p =>
      p.classList.toggle('is-active', p.dataset.pane === name));
    if (dockEl.classList.contains('collapsed')) setDockCollapsed(false);
  });
});

sideToggle.addEventListener('click', () => {
  const collapsed = document.body.classList.toggle('side-collapsed');
  sideToggle.classList.toggle('off', collapsed);
});

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'd') toggleDock();
  else if (k === 's') sideToggle.click();
});

   THEME TOGGLE
   ═══════════════════════════════════════════════════════════════ */
const themeBtn = document.getElementById('themeToggle');
function setTheme(theme) {
  document.body.classList.remove('theme-dark', 'theme-light');
  document.body.classList.add('theme-' + theme);
  themeBtn.textContent = theme === 'dark' ? '◐ LIGHT' : '◑ DARK';
}
themeBtn.addEventListener('click', () => {
  const current = document.body.classList.contains('theme-dark') ? 'dark' : 'light';
  setTheme(current === 'dark' ? 'light' : 'dark');
});
